services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: multi-car-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    image: curlimages/curl:8.16.0
    container_name: multi-car-ollama-init
    restart: "no"
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
    volumes:
      - ./scripts/ollama_pull.sh:/scripts/ollama_pull.sh:ro
    entrypoint: ["/bin/sh", "/scripts/ollama_pull.sh"]
    depends_on:
      ollama:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-car-ai-service
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-multi-car-audio-processor}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STT_MODEL_ID: ${STT_MODEL_ID:-CohereLabs/cohere-transcribe-arabic-07-2026}
      STT_MODEL_PATH: /app/models/cohere-transcribe-arabic-07-2026
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_MAX_NEW_TOKENS: ${STT_MAX_NEW_TOKENS:-256}
      VAD_ENABLED: ${VAD_ENABLED:-true}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.45}
      VAD_MIN_SPEECH_DURATION_MS: ${VAD_MIN_SPEECH_DURATION_MS:-200}
      VAD_MIN_SILENCE_DURATION_MS: ${VAD_MIN_SILENCE_DURATION_MS:-350}
      VAD_SPEECH_PAD_MS: ${VAD_SPEECH_PAD_MS:-120}
      VAD_MERGE_GAP_MS: ${VAD_MERGE_GAP_MS:-900}
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-600}
      UPLOAD_DIR: /tmp/ai-service/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-16000}
    volumes:
      - stt_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 10m

volumes:
  ollama_models:
  stt_models:
